Observation:
  description: Act of carrying out an (Observation) Procedure to estimate or calculate
    a value of a property of a FeatureOfInterest. Links to a Sensor to describe what
    made the Observation and how; links to an ObservableProperty to describe what
    the result is an estimate of, and to a FeatureOfInterest to detail what that property
    was associated with.
  properties:
    phenomenonTime:
      description: The time that the Result of an Observation, Actuation or Sampling
        applies to the FeatureOfInterest. Not necessarily the same as the resultTime.
        May be an Interval or an Instant, or some other compound TemporalEntity.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    type:
      description: Property. NGSI entity type. It must be equal to `Observation`
      enum:
      - Observation
      type: string
      x-ngsi:
        type: Property
  required:
  - id
  - type
  type: object
