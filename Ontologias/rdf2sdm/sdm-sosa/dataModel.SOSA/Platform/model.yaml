Platform:
  description: A Platform is an entity that hosts other entities, particularly Sensors,
    Actuators, Samplers, and other Platforms.
  properties:
    hosts:
      description: Relation between a Platform and a Sensor, Actuator, Sampler, or
        Platform, hosted or mounted on it.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    isHostedBy:
      description: Relation between a Sensor, Actuator, Sampler, or Platform, and
        the Platform that it is mounted on or hosted by.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    type:
      description: Property. NGSI entity type. It must be equal to `Platform`
      enum:
      - Platform
      type: string
      x-ngsi:
        type: Property
  required:
  - id
  - type
  type: object
