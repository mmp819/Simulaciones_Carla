Actuation:
  description: An Actuation carries out an (Actuation) Procedure to change the state
    of the world using an Actuator.
  properties:
    actsOnProperty:
      description: Relation between an Actuation and the property of a FeatureOfInterest
        it is acting upon.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    hasFeatureOfInterest:
      description: A relation between an Observation and the entity whose quality
        was observed, or between an Actuation and the entity whose property was modified,
        or between an act of Sampling and the entity that was sampled.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    madeByActuator:
      description: Relation linking an Actuation to the Actuator that made that Actuation.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    type:
      description: Property. NGSI entity type. It must be equal to `Actuation`
      enum:
      - Actuation
      type: string
      x-ngsi:
        type: Property
    usedProcedure:
      description: A relation to link to a re-usable Procedure used in making an Observation,
        an Actuation, or a Sample, typically through a Sensor, Actuator or Sampler.
      type: ''
      x-ngsi:
        model: ''
        type: Property
  required:
  - id
  - type
  type: object
