Sampling:
  description: An act of Sampling carries out a sampling Procedure to create or transform
    one or more samples.
  properties:
    hasFeatureOfInterest:
      description: A relation between an Observation and the entity whose quality
        was observed, or between an Actuation and the entity whose property was modified,
        or between an act of Sampling and the entity that was sampled.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    hasResult:
      description: Relation linking an Observation or Actuation or act of Sampling
        and a Result or Sample.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    madeBySampler:
      description: Relation linking an act of Sampling to the Sampler (sampling device
        or entity) that made it.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    type:
      description: Property. NGSI entity type. It must be equal to `Sampling`
      enum:
      - Sampling
      type: string
      x-ngsi:
        type: Property
    usedProcedure:
      description: A relation to link to a re-usable Procedure used in making an Observation,
        an Actuation, or a Sample, typically through a Sensor, Actuator or Sampler.
      type: ''
      x-ngsi:
        model: ''
        type: Property
  required:
  - id
  - type
  type: object
