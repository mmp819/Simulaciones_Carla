Sample:
  description: Feature which is intended to be representative of a FeatureOfInterest
    on which Observations may be made.
  properties:
    isResultOf:
      description: Relation linking a Result to the Observation or Actuation or act
        of Sampling that created or caused it.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    isSampleOf:
      description: Relation from a Sample to the FeatureOfInterest that it is intended
        to be representative of.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    type:
      description: Property. NGSI entity type. It must be equal to `Sample`
      enum:
      - Sample
      type: string
      x-ngsi:
        type: Property
  required:
  - id
  - type
  type: object
