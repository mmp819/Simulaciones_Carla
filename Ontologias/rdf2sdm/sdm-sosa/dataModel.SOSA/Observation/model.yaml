Observation:
  description: Act of carrying out an (Observation) Procedure to estimate or calculate
    a value of a property of a FeatureOfInterest. Links to a Sensor to describe what
    made the Observation and how; links to an ObservableProperty to describe what
    the result is an estimate of, and to a FeatureOfInterest to detail what that property
    was associated with.
  properties:
    hasFeatureOfInterest:
      description: A relation between an Observation and the entity whose quality
        was observed, or between an Actuation and the entity whose property was modified,
        or between an act of Sampling and the entity that was sampled.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    hasResult:
      description: Relation linking an Observation or Actuation or act of Sampling
        and a Result or Sample.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    madeBySensor:
      description: Relation between an Observation and the Sensor which made the Observation.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    observedProperty:
      description: Relation linking an Observation to the property that was observed.
        The ObservableProperty should be a property of the FeatureOfInterest (linked
        by hasFeatureOfInterest) of this Observation.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    phenomenonTime:
      description: The time that the Result of an Observation, Actuation or Sampling
        applies to the FeatureOfInterest. Not necessarily the same as the resultTime.
        May be an Interval or an Instant, or some other compound TemporalEntity.
      type: ''
      x-ngsi:
        model: ''
        type: Property
    type:
      description: Property. NGSI entity type. It must be equal to `Observation`
      enum:
      - Observation
      type: string
      x-ngsi:
        type: Property
    usedProcedure:
      description: A relation to link to a re-usable Procedure used in making an Observation,
        an Actuation, or a Sample, typically through a Sensor, Actuator or Sampler.
      type: ''
      x-ngsi:
        model: ''
        type: Property
  required:
  - id
  - type
  type: object
